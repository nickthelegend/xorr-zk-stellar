        /* Root styled by #root (never a class) — scoping requirement. */

          will-change:filter,opacity;

            radial-gradient(40% 46% at 20% 62%, rgba(226,169,241,0.08), transparent 64%);

        .vignette{

          inset:0;
          background:radial-gradient(120% 120% at 50% 42%, transparent 58%, rgba(0,0,0,0.55) 100%);
          pointer-events:none;
        }

        /* ---- camera wrapper: one slow push under the whole scene ---- */
        .camera{
          position:absolute;
          inset:0;
          transform-origin:50% 50%;
          will-change:transform;
        }

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const camera = document.getElementById("camera");

        /* ============================================================
           STATIC STATE (set before tweens so entrance transforms don't
           wipe the tilt / initial offsets)
           ============================================================ */
        // Deposit surface: static 3D tilt (right-lean) — set via gsap.set so a
        // later opacity tween never clobbers it. rotateY negative => shadow +X.
        gsap.set("#surface", { rotateY: -9, rotateX: 4, transformOrigin: "50% 50%" });

        // Commitment starts smaller (incoming of the scale-swap) + hidden.
        gsap.set("#commit", { scale: 0.62, opacity: 0 });

        /* ============================================================
           SCENE 1 (0.0–2.6s) — "XORR changes that."
           surface rises + tilts in on the right; headline reveals left;
           slow single push under it; DoF keeps the card sharp.
           ============================================================ */

        // depth: atmosphere + vignette suffuse in
        tl.fromTo("#atmos", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.0);
        tl.fromTo("#vignette", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.0);

        // the Deposit surface rises + settles (translateY + fade); tilt is static.
        // wrapper carries the rise (surface itself holds the 3D tilt).
        tl.fromTo(
          "#surfaceWrap",
          { y: 128, opacity: 0 },
          { y: 0, opacity: 1, duration: 1.5, ease: "power3.out" },
          0.15
        );

        // headline left — eyebrow, then per-word H1 (VO-paced), then subline
        tl.fromTo("#eyebrow", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.25);
        tl.fromTo(
          "#h1 .word",
          { y: 46, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.72, ease: "power3.out", stagger: 0.11 },
          0.5
        );
        tl.fromTo("#subline", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.45);

        // DoF: atmosphere blurs a hair on the push; the SURFACE (card) stays sharp.
        tl.fromTo("#atmos", { "--dof": "0px" }, { "--dof": "7px", duration: 1.3, ease: "power2.inOut" }, 0.7);

        /* ---- slow single push (multi-phase-camera) under the UI reveal ----
           2-step: settle to neutral, then a slow push that runs into the hold.
           A sine micro-drift overlays so it never feels static. */
        const phase = { scale: 0.965 };
        tl.to(phase, { scale: 1.0, duration: 1.3, ease: "power2.out" }, 0.4);   // settle
        tl.to(phase, { scale: 1.052, duration: 5.4, ease: "power2.inOut" }, 3.0); // slow push into hold

        const drift = { p: 0 };
        tl.to(
          drift,
          {
            p: Math.PI * 2 * 1.6,
            duration: 12,
            ease: "none",
            onUpdate: () => {
              const dx = Math.sin(drift.p) * 5;
              const dy = Math.sin(drift.p * 1.3) * 3;
              camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
            },
          },
          0
        );

        /* ============================================================
           SCENE 2 (2.6–5.6s) — "Shield your USDC into a zero-knowledge note"
           USDC coin lifts off the amount field, then scale-swaps into one
           glowing hexagonal commitment; ambient glow bloom behind it.
           ============================================================ */

        // coin appears (lifts off the amount field) — rises + fades in
        tl.fromTo(
          "#coin",
          { y: 78, opacity: 0, scale: 0.9 },
          { y: 0, opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
          2.7
        );

        // --- SCALE-SWAP (scale-swap-transition mechanics) at ~3.8s ---
        const SWAP = 3.8, EXIT_DUR = 0.42, ENTER_DUR = 0.62, OVERLAP = 0.16, EXIT_SCALE = 0.62;
        // outgoing coin: shrink + fade fast (power2.in)
        tl.to("#coin", { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, SWAP);
        // incoming commitment: scale up + fade in, starts slightly before coin finishes
        tl.to(
          "#commit",
          { scale: 1.0, opacity: 1, duration: ENTER_DUR, ease: "power3.out" },
          SWAP + EXIT_DUR - OVERLAP
        );

        // ambient glow bloom behind the commitment — lands on the commit's settle
        tl.fromTo(
          "#commitGlow",
          { opacity: 0, scale: 0.82 },
          { opacity: 0.42, scale: 1, duration: 0.7, ease: "power2.out" },
          SWAP + EXIT_DUR - OVERLAP
        );

        /* ============================================================
           SCENE 3 (5.6–8.5s) — "only a commitment ever touches the chain"
           commitment settles onto a thin on-chain rail; amount digits blur +
           dissolve out (-> "•••"); keyword glow on "commitment".
           ============================================================ */

        // the on-chain rail draws in (scaleX 0 -> 1 from the left)
        tl.fromTo("#rail", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, 5.5);
        tl.fromTo("#railLabel", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 6.0);
        tl.fromTo("#railNodeA", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.05);
        tl.fromTo("#railNodeB", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.2);
        tl.fromTo("#railNodeC", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.35);

        // the commitment (its whole swap-wrap) settles DOWN onto the rail.
        // swap-wrap top:360 -> rail at top:648; center of glyph (110) => move
        // so glyph center lands on the rail. y ~= +178 puts it seated on the rail.
        tl.to("#swapWrap", { y: 178, duration: 1.05, ease: "power3.inOut" }, 5.7);
        tl.to("#commitGlow", { y: 178, duration: 1.05, ease: "power3.inOut" }, 5.7);
        // ease the commitment a touch smaller as it seats (reads as "settling in")
        tl.to("#commit", { scale: 0.9, duration: 1.05, ease: "power3.inOut" }, 5.7);
        tl.to("#commitGlow", { scale: 0.9, duration: 1.05, ease: "power3.inOut" }, 5.7);

        // the amount on the card dissolves away — a cover fades in over the
        // "0.0" field and resolves to "•••" (the amount goes invisible).
        tl.fromTo("#amountMask", { opacity: 0 }, { opacity: 1, duration: 0.85, ease: "power2.inOut" }, 6.2);

        // keyword glow on the "commitment" caption (asr-keyword-glow envelope)
        // spoken window ~6.4–7.1s. attack-sustain-decay-rest on textShadow + scale.
        const cap = document.getElementById("commitCap");
        const KW_START = 6.4, KW_END = 7.15, KW_ATTACK = 0.18, KW_RELEASE = 0.5, KW_REST = 0.22;
        const KW_MAXBLUR = 26, KW_MAXSCALE = 0.14;
        function kwEnv(t){
          const relEnd = KW_END + KW_RELEASE;
          if (t < KW_START) return 0;
          if (t < KW_END) return Math.min((t - KW_START) / KW_ATTACK, 1);
          if (t < relEnd) return 1 - ((t - KW_END) / KW_RELEASE) * (1 - KW_REST);
          return KW_REST;
        }
        const kwDriver = { t: 0 };
        tl.to(
          kwDriver,
          {
            t: 12,
            duration: 12,
            ease: "none",
            onUpdate: () => {
              const e = kwEnv(kwDriver.t);
              const blur = KW_MAXBLUR * e;
              cap.style.textShadow = `0 0 ${blur}px rgba(168,85,247,${0.15 + e * 0.7})`;
              cap.style.transform = `translateX(-50%) scale(${1 + KW_MAXSCALE * e})`;
            },
          },
          0
        );

        /* ============================================================
           SCENE 4 (8.5–12s) — "the amount stays invisible"
           HOLD (a breather): card reads "•••", commitment glows on the rail;
           dead-still, subtle jitter only.
           ============================================================ */

        // subtle jitter on the seated commitment + its glow breathe (LOW amplitude).
        // Two proxies so glyph-bob and glow-breathe are slightly out of phase.
        const idle = { p: 0 };
        const swapWrap = document.getElementById("swapWrap");
        const commitGlow = document.getElementById("commitGlow");
        const IDLE_START = 8.6, IDLE_DUR = 12 - 8.6;
        // seated resting transform is y:178 (from the settle). Idle ADDS to it.
        tl.to(
          idle,
          {
            p: Math.PI * 2 * 1.3,
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(idle.p);
              // glyph: tiny vertical bob around the seated y (±2.2px)
              swapWrap.style.transform = `translateY(${178 + s * 2.2}px)`;
              // glow: breathe opacity + scale a hair, offset by 90°
              const g = Math.sin(idle.p + Math.PI / 2);
              commitGlow.style.opacity = String(0.40 + g * 0.05);
              commitGlow.style.transform = `translateY(178px) scale(${0.9 + g * 0.02})`;
            },
          },
          IDLE_START
        );

        window.__timelines["03-shield"] = tl;
      </script>
    </template>
  </body>
</html>
