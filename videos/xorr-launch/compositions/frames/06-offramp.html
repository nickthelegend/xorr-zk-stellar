    <template>
      <style>

        /* Root styled via #root (never a class on the root) — scoping rule. */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: transparent;
          font-family: "Poppins", sans-serif;
          color: #ffffff;
          -webkit-font-smoothing: antialiased;
        }

        /* Full-bleed dark ground rides on its own clip layer, NOT on #root. */
        .bg {
          position: absolute;
          inset: 0;
          background: #0d0d0f;
        }
        /* warm, grounded off-ramp glow — a low purple wash rising toward the fiat side (right),
           a faint lime kiss where the value lands; no AI blue-purple gradient, just a soft dim. */
        .bg::after {
          content: "";
          position: absolute;
          inset: 0;
          background:
            radial-gradient(70% 62% at 74% 46%, rgba(166, 242, 74, 0.05) 0%, rgba(13, 13, 15, 0) 55%),
            radial-gradient(96% 88% at 40% 50%, rgba(168, 85, 247, 0.07) 0%, rgba(13, 13, 15, 0) 52%);
        }

        /* ===================== the hero surface (Off-ramp / SEP-24) ===================== */
        /* surface clip fills the frame; the camera wrapper holds the ONE slow push + micro-drift,
           the tilt wrapper holds the STATIC 3D angle (never GSAP-transformed), the card holds the
           push-in entrance (translateZ depth inside the tilt's perspective). */
        .surface {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        .camera {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .tilt {
          position: absolute;
          left: 300px;
          top: 250px;
          width: 720px;
          height: 543px;
          /* STATIC tilt — left-leaning card faces slightly toward the fiat side on the right.
             Shadow X-offset is positive to match the negative rotateY. This element is never
             GSAP-transformed, so the CSS transform is safe. */
          transform: perspective(1600px) rotateY(-9deg) rotateX(4.5deg);
          transform-style: preserve-3d;
        }
        .card {
          position: absolute;
          inset: 0;
          border-radius: 20px;
          overflow: hidden;
          background: #0d0d0f;
          border: 1.5px solid rgba(255, 255, 255, 0.12);
          box-shadow: 44px 34px 90px rgba(0, 0, 0, 0.5);
          will-change: transform, opacity, filter;
        }
        .card img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: 50% 8%;
          display: block;
        }
        /* soft inner rim so the screenshot reads as a lifted panel, not a flat paste */
        .card::after {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: 20px;
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
          pointer-events: none;
        }

        /* a faint accent halo behind the surface (the accent shape resolving behind the hero) */
        .surface-halo {
          position: absolute;
          left: 210px;
          top: 214px;
          width: 780px;
          height: 600px;
          border-radius: 32px;
          background: radial-gradient(60% 60% at 55% 45%, rgba(168, 85, 247, 0.16) 0%, rgba(168, 85, 247, 0) 70%);
          filter: blur(8px);
          pointer-events: none;
        }

        /* ===================== chrome: LIVE ANCHOR eyebrow ===================== */
        .eyebrow {
          position: absolute;
          left: 302px;
          top: 176px;
          display: inline-flex;
          align-items: center;
          gap: 14px;
          font-weight: 600;
          font-size: 24px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #e2a9f1;
          will-change: opacity, transform;
        }
        .eyebrow .live-dot {

          border-radius: 50%;
          background: #a6f24a;
          box-shadow: 0 0 14px rgba(166, 242, 74, 0.75);
        }

        /* ===================== the fiat side (right): value lands here ===================== */
        .fiat {
          position: absolute;
          left: 1116px;
          top: 296px;
          width: 660px;
          pointer-events: none;
        }
        .fiat-label {
          font-weight: 600;
          font-size: 26px;
          letter-spacing: 0.16em;
          text-transform: uppercase;

        .fiat-figure {

        }
        .fiat-cur {
          font-weight: 700;

        }
        .fiat-num {
          font-weight: 700;
          font-size: 132px;
          line-height: 1;

          letter-spacing: -0.03em;
          font-variant-numeric: tabular-nums; /* mandatory: stable digit widths while counting */
        }

        /* SEP-24 "completed" chip — the single lime success note */
        .chip {
          position: absolute;
          left: 1120px;
          top: 470px;
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 14px 26px 14px 20px;
          border-radius: 100px;
          background: rgba(166, 242, 74, 0.12);
          border: 1.5px solid rgba(166, 242, 74, 0.4);
          will-change: opacity, transform;
        }
        .chip .check {
          width: 30px;

          flex: 0 0 auto;
        }
        .chip .check path {
          fill: none;

          stroke-linejoin: round;

        .chip .chip-txt {
          font-weight: 600;
          font-size: 32px;
          letter-spacing: 0.01em;
          color: #a6f24a;
        }

        /* ===================== bank / destination (Scene 3) ===================== */
        .dest {
          position: absolute;
          left: 1120px;
          top: 574px;
          display: flex;
          align-items: center;
          gap: 26px;
          pointer-events: none;
        }
        .bank {
          width: 128px;
          height: 116px;
          overflow: visible;
        }
        .bank path,
        .bank line,
        .bank polyline {
          fill: none;
          stroke: #a855f7;
          stroke-width: 5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .dest-label {
          display: flex;
          gap: 20px;
          font-weight: 700;
          font-size: 62px;
          line-height: 1;
          letter-spacing: -0.01em;
          color: #71717a; /* dim rest — the glow lifts the words on cue */
          white-space: nowrap;
        }
        .dest-label .w {
          display: inline-block;
          transform-origin: 50% 60%;
          will-change: transform, text-shadow, color;
        }

        /* ===================== the value in flight (Stellar -> fiat) ===================== */
        .coin {
          position: absolute;
          left: 0;
          top: 0;
          width: 76px;
          height: 76px;
          border-radius: 50%;
          background: radial-gradient(60% 60% at 40% 35%, #c98cff 0%, #a855f7 55%, #7c2fd0 100%);
          box-shadow: 0 0 26px rgba(168, 85, 247, 0.6);
          display: grid;
          place-items: center;
          will-change: transform, opacity;
        }
        .coin::before {
          content: "$";
          font-weight: 700;
          font-size: 40px;
          color: #0d0d0f;
        }
        /* thin trail the coin drags across the seam */
        .trail {
          position: absolute;
          left: 0;
          top: 0;
          width: 320px;
          height: 4px;
          border-radius: 4px;
          transform-origin: 0% 50%;
          background: linear-gradient(90deg, rgba(168, 85, 247, 0) 0%, rgba(168, 85, 247, 0.55) 100%);
          will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="06-offramp" data-width="1920" data-height="1080" data-duration="7">
        <!-- full-bleed dark ground on its own clip layer -->
        <div id="bg" class="bg clip" data-start="0" data-duration="7" data-track-index="0"></div>

        <!-- Scene 1: the Off-ramp (SEP-24) surface pushes in (3d-page-scroll tilt + one slow
             multi-phase-camera push). Accent halo resolves behind it. -->
        <div id="surface" class="surface clip" data-start="0" data-duration="7" data-track-index="1">
          <div class="surface-halo" id="halo"></div>
          <div class="camera" id="camera">
            <div class="tilt">
              <div class="card" id="card">
                <img src="assets/app-offramp.png" alt="" />
              </div>
            </div>
          </div>
        </div>

        <!-- LIVE ANCHOR · SEP-24 eyebrow (short chrome label; reinforces "a live off-ramp") -->
        <div id="eyebrow" class="eyebrow clip" data-start="0.5" data-duration="6.5" data-track-index="2">
          <span class="live-dot"></span>Live anchor&nbsp;· SEP-24
        </div>

        <!-- Scene 2: the value in flight — a coin lifts off the Stellar side and crosses to the
             fiat figure; the trail sells the travel. -->
        <div id="trail" class="trail clip" data-start="2.4" data-duration="1.1" data-track-index="3"></div>
        <div id="coin" class="coin clip" data-start="2.4" data-duration="1.1" data-track-index="4"></div>

        <!-- Scene 2: the fiat figure counts up (counting-dynamic-scale) as the value lands. -->
        <div class="fiat">
          <div id="fiatLabel" class="fiat-label clip" data-start="2.5" data-duration="4.5" data-track-index="5">
            Off-ramp
          </div>
          <div id="fiatFig" class="fiat-figure clip" data-start="2.6" data-duration="4.4" data-track-index="6">
            <span class="fiat-cur">$</span><span class="fiat-num" id="fiatNum">0.00</span>
          </div>
        </div>

        <!-- Scene 2: SEP-24 "completed" state lands in lime -->
        <div id="chip" class="chip clip" data-start="3.7" data-duration="3.3" data-track-index="7">
          <svg class="check" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
            <path id="checkPath" d="M 6 16 L 13 23 L 25 8" />
          </svg>
          <span class="chip-txt">completed</span>
        </div>

        <!-- Scene 3: a clean bank/fiat glyph resolves (svg-path-draw) beside a "your bank" label
             whose words glow on the VO cue (asr-keyword-glow). -->
        <div id="dest" class="dest clip" data-start="4.4" data-duration="2.6" data-track-index="8">
          <svg class="bank" id="bank" viewBox="0 0 128 116" xmlns="http://www.w3.org/2000/svg">
            <!-- roof -->
            <path id="bankRoof" d="M 10 40 L 64 12 L 118 40" />
            <!-- base ledge -->
            <path id="bankBase" d="M 14 96 L 114 96" />
            <!-- three columns -->
            <line id="bankC1" x1="34" y1="46" x2="34" y2="90" />
            <line id="bankC2" x1="64" y1="46" x2="64" y2="90" />
            <line id="bankC3" x1="94" y1="46" x2="94" y2="90" />
            <!-- foot -->
            <path id="bankFoot" d="M 8 108 L 120 108" />
          </svg>
          <div class="dest-label">
            <span class="w" id="wYour">your</span><span class="w" id="wBank">bank</span>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const DUR = 7;

        /* ============================================================
           Scene 1 (0.0-2.4): "And cash out to real fiat"
           The Off-ramp (SEP-24) surface pushes in — 3d-page-scroll tilt (static angle on .tilt)
           + a translateZ depth push on the card into the tilt's perspective. A slow single
           multi-phase-camera push then sits under everything for the rest of the shot.
           ============================================================ */

        // accent halo resolves behind the surface
        tl.fromTo(
          "#halo",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
          0.08,
        );

        // card push-in: comes from behind (translateZ negative) + slight down-scale + blur,
        // decelerating into the focal plane. Hero visible well before t=0.5s. fromTo (no CSS
        // transform lives on .card, so no transform conflict).
        tl.fromTo(
          "#card",
          { opacity: 0, z: -220, scale: 0.9, filter: "blur(12px)" },
          { opacity: 1, z: 0, scale: 1, filter: "blur(0px)", duration: 0.95, ease: "power3.out" },
          0.0,
        );

        // ---- one slow single push + micro-drift on the camera wrapper (multi-phase-camera,
        // steady-push mode). The scale tween mutates cam.scale; the drift tween reads it live
        // every frame and composes scale+translate. No back-half re-push. ----
        (function () {
          const camera = document.getElementById("camera");
          const cam = { scale: 1.0, p: 0 };
          // steady push: neutral -> slight push, settling deeper; lands ~4.2s then holds.
          tl.to(cam, { scale: 1.045, duration: 4.2, ease: "power2.out" }, 0.0);
          // continuous low sine drift across the whole shot (Lissajous, freq ratio ~1.3)
          const DRIFT_CYCLES = 1.2,
            AMP_X = 5,
            AMP_Y = 3;
          tl.to(
            cam,
            {
              p: Math.PI * 2 * DRIFT_CYCLES,
              duration: DUR,
              ease: "none",
              onUpdate: () => {
                const dx = Math.sin(cam.p) * AMP_X;
                const dy = Math.sin(cam.p * 1.3) * AMP_Y;
                camera.style.transform = `scale(${cam.scale}) translate(${dx}px, ${dy}px)`;
              },
            },
            0.0,
          );
        })();

        // eyebrow reveals on its cue
        tl.fromTo(
          "#eyebrow",
          { opacity: 0, y: 16, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
          0.5,
        );

        /* ============================================================
           Scene 2 (2.4-4.4): "a live off-ramp"
           Value flows from the Stellar side of the surface to the fiat figure; the counter ticks
           up to the fiat amount (counting-dynamic-scale) and the SEP-24 "completed" chip lands
           in lime.
           ============================================================ */

        // --- the coin crosses the seam: from the surface's Stellar side (lower-right of the
        //     card) to the fiat figure on the right. Positioned in stage coords via x/y. ---
        // start point ~ (952, 566) near the card edge; end point ~ (1176, 452) at the figure.
        const COIN_X0 = 952,
          COIN_Y0 = 566,
          COIN_X1 = 1176,
          COIN_Y1 = 452;
        tl.fromTo(
          "#coin",
          { x: COIN_X0, y: COIN_Y0, scale: 0.6, opacity: 0 },
          { x: COIN_X0, y: COIN_Y0, scale: 1, opacity: 1, duration: 0.24, ease: "power3.out" },
          2.4,
        );
        tl.to("#coin", { x: COIN_X1, y: COIN_Y1, duration: 0.62, ease: "power3.inOut", overwrite: "auto" }, 2.62);
        // coin absorbs into the figure as the count ignites
        tl.to("#coin", { scale: 0.32, opacity: 0, duration: 0.22, ease: "power2.in" }, 3.24);

        // trail: anchored at the start point, stretches toward the figure behind the coin, fades.
        tl.fromTo(
          "#trail",
          { x: COIN_X0 + 30, y: COIN_Y0 + 36, scaleX: 0, opacity: 0 },
          { x: COIN_X0 + 30, y: COIN_Y0 + 36, scaleX: 0.7, opacity: 1, duration: 0.4, ease: "power2.out" },
          2.66,
        );
        tl.to("#trail", { opacity: 0, duration: 0.4, ease: "power1.in" }, 3.1);

        // fiat label + figure fade up just before the count
        tl.fromTo(
          "#fiatLabel",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.5,
        );
        tl.fromTo(
          "#fiatFig",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.6,
        );

        // --- counting-dynamic-scale: value 0 -> 248.75 AND font-size grows, one shared eased
        //     tween. Currency formatted to 2 decimals with tabular-nums. power3.out (data, no
        //     overshoot). Ignites as the coin lands. ---
        (function () {
          const num = document.getElementById("fiatNum");
          const state = { value: 0, size: 78 };
          const TARGET = 248.75,
            START_SIZE = 78,
            END_SIZE = 132;
          tl.to(
            state,
            {
              value: TARGET,
              size: END_SIZE,
              duration: 1.15,
              ease: "power3.out",
              onUpdate: () => {
                num.textContent = state.value.toFixed(2);
                num.style.fontSize = state.size + "px";
              },
            },
            2.98,
          );
        })();

        // --- SEP-24 "completed" chip lands in lime after the count settles; the check draws. ---
        tl.fromTo(
          "#chip",
          { opacity: 0, y: 22, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
          3.9,
        );
        (function () {
          const p = document.getElementById("checkPath");
          if (!p) return;
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
          tl.fromTo(
            p,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
            4.08,
          );
        })();

        /* ============================================================
           Scene 3 (4.4-end): "straight to your bank"
           A clean bank/fiat glyph resolves (svg-path-draw) beside the figure; keyword glow on
           "your bank"; then the frame holds still with only subtle jitter.
           ============================================================ */

        // --- svg-path-draw: the bank glyph draws itself, segment by segment (staggered so the
        //     eye reads one continuous trace). Roof -> base -> columns -> foot. ---
        (function () {
          const segs = [
            { id: "bankRoof", at: 4.5, dur: 0.5 },
            { id: "bankBase", at: 4.74, dur: 0.34 },
            { id: "bankC1", at: 4.92, dur: 0.3 },
            { id: "bankC2", at: 5.04, dur: 0.3 },
            { id: "bankC3", at: 5.16, dur: 0.3 },
            { id: "bankFoot", at: 5.32, dur: 0.34 },
          ];
          segs.forEach((s) => {
            const el = document.getElementById(s.id);
            if (!el) return;
            const len = el.getTotalLength();
            el.style.strokeDasharray = len;
            el.style.strokeDashoffset = len;
            tl.fromTo(
              el,
              { strokeDashoffset: len },
              { strokeDashoffset: 0, duration: s.dur, ease: "power2.out" },
              s.at,
            );
          });
        })();

        // "your bank" label rises in, then the words glow on cue
        tl.fromTo(
          ".dest-label",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          4.78,
        );

        // --- asr-keyword-glow: karaoke-style envelope on "your" then "bank" — dim rest, active
        //     word lerps bright + purple glow + slight scale. Single linear driver over the scene. ---
        (function () {
          const words = [
            { el: document.getElementById("wYour"), start: 5.0, end: 5.35 },
            { el: document.getElementById("wBank"), start: 5.4, end: 6.4 }, // longer sustain (payoff word)
          ];
          const ATTACK = 0.16,
            RELEASE = 0.4,
            REST = 0.14,
            MAX_BLUR = 30,
            MAX_SCALE = 0.16;
          // dim rest -> bright active, per-channel lerp
          const REST_RGB = [113, 113, 122]; // #71717a
          const ACT_RGB = [244, 233, 255]; // near-white with a lavender cast
          function envelope(t, start, end) {
            const releaseEnd = end + RELEASE;
            if (t < start) return 0;
            if (t < end) return Math.min((t - start) / ATTACK, 1);
            if (t < releaseEnd) {
              const decay = (t - end) / RELEASE;
              return 1 - decay * (1 - REST);
            }
            return REST;
          }
          function ch(a, b, e) {
            return Math.round(a + (b - a) * e);
          }
          const driver = { t: 0 };
          tl.to(
            driver,
            {
              t: DUR,
              duration: DUR,
              ease: "none",
              onUpdate: () => {
                words.forEach((w) => {
                  if (!w.el) return;
                  const env = envelope(driver.t, w.start, w.end);
                  const blur = MAX_BLUR * env;
                  const scale = 1 + MAX_SCALE * env;
                  const a = 0.28 + env * 0.6;
                  w.el.style.color = `rgb(${ch(REST_RGB[0], ACT_RGB[0], env)}, ${ch(REST_RGB[1], ACT_RGB[1], env)}, ${ch(REST_RGB[2], ACT_RGB[2], env)})`;
                  w.el.style.textShadow = `0 0 ${blur}px rgba(168, 85, 247, ${a})`;
                  w.el.style.transform = `scale(${scale})`;
                });
              },
            },
            0,
          );
        })();

        /* ============================================================
           Held read (5.9-end): the frame is settled; only subtle low-amplitude jitter on the
           fiat figure keeps it alive (sine-wave-loop, LOW end). No breathing on everything.
           ============================================================ */
        (function () {
          const fig = document.getElementById("fiatFig");
          if (!fig) return;
          const IDLE_START = 5.9,
            IDLE_DUR = DUR - 5.9,
            CYCLES = 0.6, // ~1.8s per breath across the ~1.1s tail
            Y_AMP = 2.2;
          const phase = { p: 0 };
          tl.to(
            phase,
            {
              p: Math.PI * 2 * CYCLES,
              duration: IDLE_DUR,
              ease: "none",
              onUpdate: () => {
                const y = Math.sin(phase.p) * Y_AMP;
                fig.style.transform = `translateY(${y}px)`;
              },
            },
            IDLE_START,
          );
        })();

        window.__timelines["06-offramp"] = tl;
      </script>
    </template>
  </body>
