<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d0d0f;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-problem"
        class="scene"
        data-composition-id="02-problem"
        data-composition-src="compositions/frames/02-problem.html"
        data-start="5"
        data-duration="6.9"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-problem-voice"
        src="assets/voice/02.wav"
        data-start="5"
        data-duration="6.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-shield"
        class="scene"
        data-composition-id="03-shield"
        data-composition-src="compositions/frames/03-shield.html"
        data-start="11.5"
        data-duration="12.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-shield-voice"
        src="assets/voice/03.wav"
        data-start="11.5"
        data-duration="12"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-pay"
        class="scene"
        data-composition-id="04-pay"
        data-composition-src="compositions/frames/04-pay.html"
        data-start="23.5"
        data-duration="8.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-pay-voice"
        src="assets/voice/04.wav"
        data-start="23.5"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-bridge"
        class="scene"
        data-composition-id="05-bridge"
        data-composition-src="compositions/frames/05-bridge.html"
        data-start="31.5"
        data-duration="9"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-bridge-voice"
        src="assets/voice/05.wav"
        data-start="31.5"
        data-duration="8.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-offramp"
        class="scene"
        data-composition-id="06-offramp"
        data-composition-src="compositions/frames/06-offramp.html"
        data-start="40"
        data-duration="7.4"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-offramp-voice"
        src="assets/voice/06.wav"
        data-start="40"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="47"
        data-duration="13"
        data-track-index="0"
      ></div>
      <audio
        id="el-07-cta-voice"
        src="assets/voice/07.wav"
        data-start="47"
        data-duration="13"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.loop.mp3"
        data-start="0"
        data-duration="60"
        data-track-index="11"
        data-volume="0.05"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="60"
        data-track-index="2"
      ></div>

      <!-- SFX -->
      <!-- harsh per-beat SFX removed (glass hit, sub impact, riser, brand swell,
           chime, whoosh, synth confirm) — only the subtle transition-clicks remain -->
      <audio
        id="el-sfx-7"
        src="assets/sfx/transition-click.mp3"
        data-start="5"
        data-duration="0.05"
        data-track-index="27"
        data-volume="0.18"
      ></audio>
      <audio
        id="el-sfx-8"
        src="assets/sfx/transition-click.mp3"
        data-start="11.5"
        data-duration="0.05"
        data-track-index="28"
        data-volume="0.18"
      ></audio>
      <audio
        id="el-sfx-9"
        src="assets/sfx/transition-click.mp3"
        data-start="23.5"
        data-duration="0.05"
        data-track-index="29"
        data-volume="0.18"
      ></audio>
      <audio
        id="el-sfx-10"
        src="assets/sfx/transition-click.mp3"
        data-start="31.5"
        data-duration="0.05"
        data-track-index="30"
        data-volume="0.18"
      ></audio>
      <audio
        id="el-sfx-11"
        src="assets/sfx/transition-click.mp3"
        data-start="40"
        data-duration="0.05"
        data-track-index="31"
        data-volume="0.18"
      ></audio>
      <audio
        id="el-sfx-12"
        src="assets/sfx/transition-click.mp3"
        data-start="47"
        data-duration="0.05"
        data-track-index="32"
        data-volume="0.18"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-problem", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-02-problem", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 11.5);
        tl.fromTo("#el-03-shield", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 11.5);
        tl.to("#el-03-shield", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 23.5);
        tl.fromTo("#el-04-pay", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 23.5);
        tl.to("#el-04-pay", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 31.5);
        tl.fromTo("#el-05-bridge", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 31.5);
        tl.to("#el-05-bridge", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 40);
        tl.fromTo("#el-06-offramp", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 40);
        tl.to("#el-06-offramp", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 47);
        tl.fromTo("#el-07-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 47);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
